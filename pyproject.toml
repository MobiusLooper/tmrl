[project]
name = "rl-racer"
version = "0.1.0"
description = "A playable reinforcement-learning racing sandbox"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "torch>=2.6,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
